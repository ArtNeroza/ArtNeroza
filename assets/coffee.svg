<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="coffee">
  <style>
    .steam, .cup { fill: none; stroke: #E8734A; stroke-linecap: round; stroke-linejoin: round; }
    .steam { stroke-width: 2.1; }
    .cup   { stroke-width: 1.8; }
    .steam path {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: steam 2.8s ease-in-out infinite;
    }
    .steam path:nth-child(2) { animation-delay: .9s; }
    @keyframes steam {
      0%   { opacity: 0;   transform: translateY(2px)  scaleY(.55); }
      30%  { opacity: .9; }
      60%  { opacity: .55; }
      100% { opacity: 0;   transform: translateY(-3px) scaleY(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam path { animation: none; opacity: .8; }
    }
  </style>
  <g class="steam">
    <path d="M8.8 9c0-1.7 1.5-2.1 1.5-3.8S8.8 3.2 8.8 1.5"/>
    <path d="M14.2 9c0-1.7 1.5-2.1 1.5-3.8s-1.5-2-1.5-3.7"/>
  </g>
  <g class="cup">
    <path d="M4 11.5h12.5v4.2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-4.2Z"/>
    <path d="M16.5 13h1.3a2.4 2.4 0 0 1 0 4.8h-1.3"/>
    <path d="M3.2 22.2h14"/>
  </g>
</svg>
